# * Runs the same checks as pre-commit (format, tests, 100% coverage) on
# * every push and pull request, so a commit made with --no-verify is caught.
name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  checks:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install g++ and GoogleTest
        run: |
          sudo apt-get update
          sudo apt-get install -y g++ libgtest-dev

      - name: Run pre-commit on all files
        run: |
          pip install pre-commit
          pre-commit run --all-files --show-diff-on-failure
